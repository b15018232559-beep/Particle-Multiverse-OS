[package]
name = "particle-multiverse-os"
version = "10.0.0"
description = "Particle Multiverse OS"
authors = ["Particle Multiverse OS"]
edition = "2021"

[lib]
name = "particle_multiverse_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
